name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save eslint@9
      - run: npx eslint .

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: build and validate exactly as AMO will
        run: |
          npm install --no-save addons-linter
          chmod +x ./build.sh
          ./build.sh
          # AMO rejects a package whose manifest sits inside a folder, and the
          # rejection message points at packaging rather than at the cause.
          unzip -l tab-groups-sync-restore-*.zip | grep -q ' manifest.json$'
          npx addons-linter tab-groups-sync-restore-*.zip

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: build and validate exactly as AMO will
        run: |
          npm install --no-save addons-linter
          ./build.sh
          # AMO rejects a package whose manifest sits inside a folder, and the
          # rejection message points at packaging rather than at the cause.
          unzip -l tab-groups-sync-restore-*.zip | grep -q ' manifest.json$'
          npx addons-linter tab-groups-sync-restore-*.zip

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l server/rest-endpoint.php
